<div class="layout" [class.menu-open]="layout.menuOpen">

  <!-- ============ LEFT SIDEBAR ============ -->
  <div class="sidebar" (click)="layout.closeMenu()">

    <img class="logo" src="assets/brand/logo.png">

    <div class="menu">

      <a class="menu-btn home-btn" routerLink="/home" routerLinkActive="active">
        <span class="menu-icon"><img src="assets/dashboard/home.png"></span>
      </a>

      <a class="menu-btn planning-btn" routerLink="/planning" routerLinkActive="active">
        <span class="menu-icon"><img src="assets/dashboard/plus.png"></span>
      </a>

      <a class="menu-btn approvals-btn" routerLink="/approvals" routerLinkActive="active">
        <span class="menu-icon"><img src="assets/dashboard/token.png"></span>
      </a>

      <a class="menu-btn settings-btn" routerLink="/settings" routerLinkActive="active">
        <span class="menu-icon"><img src="assets/dashboard/setting.png"></span>
      </a>

    </div>

    <img class="my-photo" src="assets/people/Me.png">

  </div>

  <!-- ============ RIGHT SIDE (screens open here) ============ -->
  <div class="content">
    <router-outlet />
  </div>

</div>
